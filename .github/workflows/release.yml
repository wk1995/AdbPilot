name: Build Release

on:
  pull_request_target:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:
    inputs:
      windows:
        description: Build Windows; bump only when business code changed.
        required: true
        default: true
        type: boolean
      macos:
        description: Build macOS; bump only when business code changed.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read
  pull-requests: read

# Serialize version decisions and uploads, including manual runs and reruns.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve builds and platform versions
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      windows_build: ${{ steps.resolve.outputs.windows_build }}
      macos_build: ${{ steps.resolve.outputs.macos_build }}
      windows_version: ${{ steps.resolve.outputs.windows_version }}
      macos_version: ${{ steps.resolve.outputs.macos_version }}
      windows_tag: ${{ steps.resolve.outputs.windows_tag }}
      macos_tag: ${{ steps.resolve.outputs.macos_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve builds and apply business code version changes
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_WINDOWS: ${{ github.event.inputs.windows || 'false' }}
          INPUT_MACOS: ${{ github.event.inputs.macos || 'false' }}
        run: |
          python packaging/scripts/resolve_release.py \
            --event "$EVENT_NAME" \
            --windows "$INPUT_WINDOWS" \
            --macos "$INPUT_MACOS" \
            --apply

      - name: Commit, tag, and create platform releases
        if: steps.resolve.outputs.windows_build == 'true' || steps.resolve.outputs.macos_build == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_BUILD: ${{ steps.resolve.outputs.windows_build }}
          MACOS_BUILD: ${{ steps.resolve.outputs.macos_build }}
        run: |
          set -euo pipefail

          windows_version="$(tr -d '[:space:]' < packaging/windows/version.txt)"
          macos_version="$(tr -d '[:space:]' < packaging/macos/version.txt)"

          git fetch --tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.md packaging/windows/version.txt packaging/windows/README.md \
            packaging/windows/file_version_info.txt packaging/macos/version.txt packaging/macos/README.md

          if git diff --cached --quiet; then
            echo "No version file changes to commit."
          else
            git commit -m "[home][mac-min] chore: release desktop platform versions [skip ci]"
            git push origin HEAD:master
          fi

          release_sha="$(git rev-parse HEAD)"

          create_release() {
            local platform="$1"
            local version="$2"
            local tag="$platform-v$version"
            local title_platform="$3"

            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              git tag "$tag"
              git push origin "refs/tags/$tag"
            fi

            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" \
                --verify-tag \
                --title "AdbPilot $title_platform $tag" \
                --notes "Automated $title_platform desktop release for AdbPilot $version."
            fi
          }

          if [ "$WINDOWS_BUILD" = "true" ]; then
            create_release "windows" "$windows_version" "Windows"
          fi

          if [ "$MACOS_BUILD" = "true" ]; then
            create_release "macos" "$macos_version" "macOS"
          fi

          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows ${{ matrix.systemos }}-bit
    runs-on: windows-latest
    needs: version
    if: needs.version.outputs.windows_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-architecture: x86
            systemos: "32"
          - python-architecture: x64
            systemos: "64"
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.release_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-architecture }}

      - name: Build Windows app
        shell: pwsh
        run: .\packaging\windows\build_windows.ps1 -Mode onedir

      - name: Package Windows app
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.windows_version }}
          SYSTEMOS: ${{ matrix.systemos }}
        run: Compress-Archive -Path dist\AdbPilot -DestinationPath "AdbPilot-windows-$env:VERSION-$env:SYSTEMOS.zip" -Force

      - name: Upload Windows release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.windows_tag }}
          VERSION: ${{ needs.version.outputs.windows_version }}
          SYSTEMOS: ${{ matrix.systemos }}
        run: |
          $asset = "AdbPilot-windows-$env:VERSION-$env:SYSTEMOS.zip"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            gh release upload $env:TAG $asset --clobber
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Start-Sleep -Seconds 10
          }
          exit $LASTEXITCODE

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: adbpilot-windows-${{ needs.version.outputs.windows_version }}-${{ matrix.systemos }}
          path: AdbPilot-windows-${{ needs.version.outputs.windows_version }}-${{ matrix.systemos }}.zip

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: version
    if: needs.version.outputs.macos_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            python-architecture: x64
          - os: macos-14
            arch: arm64
            python-architecture: arm64
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.release_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-architecture }}

      - name: Build macOS app
        env:
          PYTHON_BIN: python3
        run: bash packaging/macos/build_macos.sh ${{ matrix.arch }}

      - name: Package macOS app
        env:
          VERSION: ${{ needs.version.outputs.macos_version }}
          ARCH: ${{ matrix.arch }}
        run: ditto -c -k --sequesterRsrc --keepParent dist/AdbPilot.app "AdbPilot-macos-$VERSION-$ARCH.zip"

      - name: Upload macOS release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.macos_tag }}
          VERSION: ${{ needs.version.outputs.macos_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          asset="AdbPilot-macos-$VERSION-$ARCH.zip"
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "$asset" --clobber; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: adbpilot-macos-${{ needs.version.outputs.macos_version }}-${{ matrix.arch }}
          path: AdbPilot-macos-${{ needs.version.outputs.macos_version }}-${{ matrix.arch }}.zip
